apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: heart-mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: heart-traefik
rules:
  - apiGroups: ['']
    resources: [services, endpoints, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: heart-traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: heart-traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: heart-mlops
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: heart-traefik
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: heart-mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heart-traefik
  template:
    metadata:
      labels:
        app: heart-traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.3.6
          args:
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=heart-traefik
            - --entrypoints.web.address=:8000
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: heart-ingress
  namespace: heart-mlops
spec:
  type: NodePort
  selector:
    app: heart-traefik
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-api
  namespace: heart-mlops
spec:
  ingressClassName: heart-traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heart-api
                port:
                  number: 80
